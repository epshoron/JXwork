name: Package shared folder

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '.github/workflows/package-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare shared-only artifact
        run: |
          mkdir -p package
          cp -a shared package/shared
      - uses: actions/upload-artifact@v4
        with:
          name: JXwork-shared
          path: package/
          retention-days: 30
