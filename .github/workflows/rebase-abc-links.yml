name: Rebase A B C references after migration

on:
  push:
    branches: [main]
    paths:
      - 'assistant/tools/rebase_abc_links.py'
      - '.github/workflows/rebase-abc-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase relative links and audit
        run: python assistant/tools/rebase_abc_links.py
      - name: Commit restored links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared assistant presentation
          if ! git diff --cached --quiet; then
            git commit -m "Repair links following A B C shared directory normalization"
            git push
          fi
